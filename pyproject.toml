[project]
name = "merchandise-pulse"
version = "0.1.0"
description = "Retail merchandise reporting and supplier performance demo"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3",
  "plotly>=6,<7",
  "streamlit>=1.45,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/merchandise_pulse"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
